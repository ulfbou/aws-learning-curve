- id: source.aws.vpc.phase1.fragment.002
  language: en-US
  content_fingerprint: 08acbc2ecdfa625ff4475f7d5950bc2e
  locator:
    section: Subnets and route tables
    start_offset: 304
    end_offset: 1117
  exact_text: '## Subnets and route tables


    A subnet is a range of IP addresses inside one Availability Zone. Placing a workload
    in a subnet does not by itself make that workload public or private.


    Each subnet is associated with a route table. The route table determines where
    traffic matching a destination is sent. A local route supports communication within
    the VPC address range. Additional routes can direct traffic to an internet gateway,
    a NAT gateway, a transit gateway, a virtual private gateway, or another supported
    target.


    A subnet is commonly described as public when its associated route table has a
    route to an internet gateway. A subnet without that route is commonly described
    as private. This classification describes the subnet''s routing configuration,
    not the complete reachability of every workload in it.'
