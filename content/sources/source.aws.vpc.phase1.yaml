  exact_text: '# Amazon VPC: routing, reachability, and filtering


    An Amazon Virtual Private Cloud is a regional network boundary. A VPC contains
    IP address ranges, subnets, route tables, gateways, and network-security controls.
    These parts work together, but each answers a different question about network
    behavior.'
