- id: source.aws.vpc.phase1.fragment.006
  language: en-US
  content_fingerprint: 020048b0bd6a6fcc904a5b443eba8104
  locator:
    section: Reasoning about reachability
    start_offset: 3027
    end_offset: 3838
  exact_text: '## Reasoning about reachability


    To reason about whether a connection can succeed, trace the complete path:


    1. Confirm the source and destination addresses.

    2. Inspect the route table associated with the source subnet.

    3. Inspect the route table associated with the destination subnet when applicable.

    4. Verify that required gateways or routing targets exist and are attached correctly.

    5. Verify public addressing or NAT translation when internet communication is
    involved.

    6. Evaluate security-group rules.

    7. Evaluate network-ACL rules in both directions.

    8. Confirm that the workload, operating system, and application accept and return
    the traffic.


    A failure at any one of these layers can prevent the connection. Describing a
    subnet as public or private is therefore only the beginning of the analysis.'
