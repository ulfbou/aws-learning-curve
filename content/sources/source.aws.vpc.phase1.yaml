- id: source.aws.vpc.phase1.fragment.005
  language: en-US
  content_fingerprint: 949a9b991379345e59f4bc96fb94b9ca
  locator:
    section: Security groups and network ACLs
    start_offset: 2390
    end_offset: 3025
  exact_text: '## Security groups and network ACLs


    Security groups are stateful controls associated with network interfaces. If traffic
    is allowed in one direction, corresponding response traffic is automatically allowed
    by the stateful connection tracking.


    Network ACLs are stateless controls applied at the subnet boundary. Rules are
    evaluated separately for inbound and outbound traffic, so both directions must
    permit the required flow.


    Routing decides the next destination for traffic. Security groups and network
    ACLs decide whether the traffic is permitted. These controls complement each other
    and should not be treated as interchangeable.'
