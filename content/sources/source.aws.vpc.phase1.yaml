- id: source.aws.vpc.phase1.fragment.004
  language: en-US
  content_fingerprint: bb02e5b439058952baec7ceb9d4d6140
  locator:
    section: NAT gateways and outbound access
    start_offset: 1784
    end_offset: 2388
  exact_text: '## NAT gateways and outbound access


    A NAT gateway allows workloads using private IPv4 addresses to initiate outbound
    connections while preventing unsolicited inbound connections from being initiated
    through that NAT gateway.


    A public NAT gateway is created in a public subnet and uses an Elastic IP address.
    Its subnet needs a route to an internet gateway. Private subnets can route selected
    internet-bound traffic to the NAT gateway.


    The NAT gateway does not make the private workload directly addressable from the
    internet. It translates the outbound connection and the corresponding return traffic.'
