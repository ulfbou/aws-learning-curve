- id: source.aws.vpc.phase1.fragment.003
  language: en-US
  content_fingerprint: 840f7058768f35535b31b17497c83cd2
  locator:
    section: Internet gateways and public addressing
    start_offset: 1119
    end_offset: 1782
  exact_text: '## Internet gateways and public addressing


    An internet gateway is attached to a VPC and can serve as the target for internet-bound
    routes. A route to an internet gateway is necessary for direct internet communication,
    but the route alone is not sufficient.


    For inbound or outbound IPv4 internet communication through an internet gateway,
    a workload also needs a public IPv4 address or an Elastic IP address. Its security
    group and network ACLs must permit the relevant traffic. The workload and operating
    system must also listen for and respond to that traffic.


    A workload can therefore be located in a public subnet and still be unreachable
    from the internet.'
