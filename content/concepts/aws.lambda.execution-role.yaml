id: aws.lambda.execution-role
kind: concept
concept_type: entity
status: published
domain: aws-cloud
labels:
  sv-SE:
    preferred: Lambda execution role
    alternatives:
    - exekveringsroll
  en:
    preferred: Lambda execution role
definition:
  sv-SE: Den IAM-roll vars behörigheter bestämmer vilka AWS-åtgärder en Lambda-funktion
    får utföra under körningen.
  en: The IAM role whose permissions determine which AWS actions a Lambda function
    may perform during execution.
explanations:
- id: aws.lambda.execution-role.explanation.foundation
  level: foundation
  language: sv-SE
  text: Triggern får funktionen att starta. Execution role ger funktionen behörighet
    att exempelvis skriva loggar eller läsa från S3.
key_points:
- En execution role initierar inte funktionen.
- Rollen används under funktionens körning.
- Rollen ska följa least privilege.
examples:
- function: Bearbeta en uppladdad fil
  required_permissions:
  - logs:CreateLogStream
  - logs:PutLogEvents
  - s3:GetObject
