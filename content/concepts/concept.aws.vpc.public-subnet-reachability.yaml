domain: aws-cloud
concept_type: model
labels:
  en-US:
    preferred: Public subnet reachability
definition:
  en-US: A public subnet provides a route toward an internet gateway, but workload
    reachability still depends on public addressing, permitted security controls,
    and application behavior across the complete traffic path.
explanations:
- language: en-US
  text: Calling a subnet public describes its route-table association. It does not
    prove that a particular workload can communicate with the internet. For direct
    IPv4 internet communication, the workload also requires appropriate public addressing.
    Security groups and network ACLs must permit the flow, and the operating system
    and application must accept and return the traffic.
key_points:
- A subnet is commonly classified as public when its route table directs internet-bound
  traffic to an internet gateway.
- A route to an internet gateway is necessary for direct internet communication but
  is not sufficient by itself.
- The workload needs suitable public IPv4 addressing for direct IPv4 internet communication.
- Security groups are stateful, while network ACLs are stateless and must permit the
  required directions.
- The workload, operating system, and application must listen for and return the traffic.
- Reachability analysis must trace the complete path rather than infer connectivity
  from the subnet label.
examples:
- language: en-US
  text: An EC2 instance is placed in a subnet whose route table sends 0.0.0.0/0 to
    an internet gateway. The instance has no public IPv4 address, so it cannot communicate
    directly with the internet through that gateway.
- language: en-US
  text: An instance has a public IPv4 address and the subnet has an internet-gateway
    route, but the security group does not permit the intended inbound connection.
    The instance remains unreachable for that connection.
non_examples:
- A subnet is not proven private merely because one workload in it is unreachable.
- A route-table entry does not override security-group, network-ACL, operating-system,
  or application behavior.
relationships: []
confusion_signals:
- Treating public subnet as equivalent to publicly reachable workload.
- Checking the route table but not public addressing.
- Treating security groups and network ACLs as interchangeable.
- Ignoring the return path or the application listener.
