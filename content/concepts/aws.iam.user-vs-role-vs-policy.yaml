definition:
  en-US: An IAM policy defines permissions. An IAM role can be assumed to obtain temporary
    credentials and is not a long-term credential attached to a person. The supplied
    bounded context does not define IAM users, so that part of the comparison remains
    unresolved.
key_points:
- An IAM policy defines permissions.
- An IAM role can be assumed to obtain temporary credentials.
- An IAM role is not a long-term credential attached to a person.
- The supplied bounded context does not define IAM users.
