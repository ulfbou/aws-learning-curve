name: Issue policy

on:
  issues:
    types:
      - opened
      - edited
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
      - reopened

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Validate required issue metadata
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(label => label.name);
            const typeLabels = labels.filter(label => label.startsWith('type:'));
            const areaLabels = labels.filter(label => label.startsWith('area:'));
            const priorityLabels = labels.filter(label => label.startsWith('priority:'));
            const failures = [];

            if (typeLabels.length !== 1) {
              failures.push(`expected exactly one type label, found ${typeLabels.length}`);
            }

            if (areaLabels.length < 1) {
              failures.push('expected at least one area label');
            }

            if (priorityLabels.length !== 1) {
              failures.push(`expected exactly one priority label, found ${priorityLabels.length}`);
            }

            if (!issue.milestone) {
              failures.push('expected one roadmap milestone');
            }

            const marker = '<!-- issue-policy -->';
            const body = failures.length === 0
              ? `${marker}\nIssue policy: PASS`
              : `${marker}\nIssue policy: ACTION REQUIRED\n\n${failures.map(item => `- ${item}`).join('\n')}`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100
              }
            );

            const existing = comments.find(
              comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
            }

            if (failures.length > 0) {
              core.setFailed(failures.join('; '));
            }
