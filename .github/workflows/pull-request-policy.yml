name: Pull request policy

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Validate pull request metadata
        uses: actions/github-script@v7
        with:
          script: |
            const pull = context.payload.pull_request;
            const labels = pull.labels.map(label => label.name);
            const body = pull.body || '';
            const failures = [];

            if (labels.filter(label => label.startsWith('type:')).length !== 1) {
              failures.push('exactly one type label is required');
            }

            if (labels.filter(label => label.startsWith('area:')).length < 1) {
              failures.push('at least one area label is required');
            }

            if (labels.filter(label => label.startsWith('priority:')).length !== 1) {
              failures.push('exactly one priority label is required');
            }

            if (!pull.milestone) {
              failures.push('one roadmap milestone is required');
            }

            const requiredHeadings = [
              '## Objective',
              '## Scope',
              '## Evidence and grounding',
              '## Validation',
              '## Risks and recovery',
              '## Issue'
            ];

            for (const heading of requiredHeadings) {
              if (!body.includes(heading)) {
                failures.push(`missing section: ${heading}`);
              }
            }

            const closingReference =
              /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\d+/i;

            if (!closingReference.test(body)) {
              failures.push(
                'the Issue section must contain a closing reference such as Closes #123'
              );
            }

            if (failures.length > 0) {
              core.setFailed(failures.join('; '));
            }
