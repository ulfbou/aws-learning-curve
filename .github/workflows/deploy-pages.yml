name: Validate and deploy GitHub Pages

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out frontend revision
        uses: actions/checkout@v4
        with:
          path: frontend
          persist-credentials: false

      - name: Check out backend content
        uses: actions/checkout@v4
        with:
          ref: backend
          path: backend
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: frontend/requirements.txt

      - name: Install Python dependencies
        working-directory: frontend
        run: python -m pip install --requirement requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test bounded learning workflow
        working-directory: frontend
        run: |
          python -m unittest -v \
            tests.test_learning_workflow_conflicts \
            tests.test_learning_workflow_e2e \
            tests.test_learning_workflow_chat_task

      - name: Build verified release transaction
        run: >-
          python frontend/scripts/release.py
          --ci
          --frontend frontend
          --backend backend
          --output release

      - name: Upload PR evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: verified-pages-${{ github.event.pull_request.number }}
          path: release
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: release

  deploy:
    if: github.event_name != 'pull_request'
    needs: release
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy exact verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
