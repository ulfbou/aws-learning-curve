name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate learning content
        run: python scripts/validate_content.py

      - name: Test bounded learning workflow
        run: |
          python -m unittest -v \
            tests.test_learning_workflow_conflicts \
            tests.test_learning_workflow_e2e

      - name: Compile bounded learning workflow
        run: |
          python -m py_compile \
            scripts/content_workflow.py \
            scripts/learning_workflow/engine.py \
            tests/test_learning_workflow_conflicts.py \
            tests/test_learning_workflow_e2e.py

      - name: Build learning bundle
        run: python scripts/build_learning_bundle.py

      - name: Build production CSS
        run: npm run build:css

      - name: Check browser JavaScript syntax
        run: node --check public/app.js

      - name: Verify GitHub Pages artifact
        run: python scripts/verify_pages.py

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
